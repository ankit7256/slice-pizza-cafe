<!DOCTYPE html>
<html lang="hi" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track Your Order - Slice Pizza & Cafe</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/custom.css">
</head>
<body class="bg-[#faf7f2] text-gray-800 antialiased">
  <nav class="bg-white/95 backdrop-blur-md sticky top-0 z-40 border-b border-gray-100 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-3">
        <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-red-600 to-amber-500 flex items-center justify-center text-white text-2xl shadow-lg">
          <i class="fa-solid fa-pizza-slice"></i>
        </div>
        <h1 class="text-xl sm:text-2xl font-black text-gray-900">SLICE <span class="text-red-600 font-serif italic">Pizza & Cafe</span></h1>
      </a>
      <div class="hidden md:flex items-center gap-6 text-sm font-bold text-gray-700">
        <a href="index.html" class="hover:text-red-600">Home</a>
        <a href="index.html#menu-section" class="hover:text-red-600">Menu</a>
        <a href="track.html" class="text-red-600 font-extrabold flex items-center gap-1"><i class="fa-solid fa-location-dot"></i> Live Tracker</a>
        <a href="customers.html" class="hover:text-red-600">Our Customers</a>
        <a href="about.html" class="hover:text-red-600">About Us</a>
      </div>
      <a href="index.html" class="px-4 py-2 bg-red-600 text-white rounded-full font-bold text-xs shadow hover:bg-red-700">Order Pizza</a>
    </div>
  </nav>

  <section class="bg-gradient-to-b from-amber-50 via-orange-50/40 to-transparent py-12">
    <div class="max-w-4xl mx-auto px-4 text-center space-y-3">
      <span class="px-3.5 py-1.5 bg-amber-500 text-gray-950 rounded-full text-xs font-black tracking-wider uppercase">📍 Realtime Delivery Tracker</span>
      <h1 class="text-3xl sm:text-4xl font-black text-gray-950">Aapka Order Kahan Tak Pahuncha?</h1>
      <p class="text-gray-600 text-sm">Apna 10-Digit Mobile Number ya Order ID enter karein.</p>
      <div class="max-w-md mx-auto pt-4 flex gap-2">
        <input type="text" id="track-search-input" placeholder="Enter Mobile No (Ex: 9876543210)" class="flex-1 px-4 py-3 bg-white border border-gray-200 rounded-2xl text-sm font-bold focus:outline-none focus:ring-2 focus:ring-red-500 shadow-sm">
        <button onclick="searchOrderStatus()" class="px-6 py-3 bg-red-600 hover:bg-red-700 text-white font-bold text-sm rounded-2xl shadow transition">Track</button>
      </div>
    </div>
  </section>

  <main class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">
    <div id="tracking-result-container"></div>
  </main>

  <script src="js/shared.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const lastPhone = localStorage.getItem("slice_last_order_phone");
      if (lastPhone) {
        document.getElementById("track-search-input").value = lastPhone;
        searchOrderStatus();
      }
    });

    function searchOrderStatus() {
      const q = document.getElementById("track-search-input").value.trim().toLowerCase();
      const container = document.getElementById("tracking-result-container");
      const orders = getAllOrders();

      if (!q) {
        container.innerHTML = `<div class="bg-white p-8 rounded-3xl border border-gray-100 text-center shadow-sm"><p class="text-sm font-bold text-gray-600">Mobile number enter karein.</p></div>`;
        return;
      }

      const matching = orders.filter(o => o.phone.includes(q) || o.id.toLowerCase().includes(q));
      if (matching.length === 0) {
        container.innerHTML = `<div class="bg-white p-8 rounded-3xl border border-gray-100 text-center shadow-sm"><p class="text-sm font-bold text-gray-600">Koi active order nahi mila.</p></div>`;
        return;
      }

      const statusSteps = ["Received", "Preparing", "Out for Delivery", "Delivered"];
      container.innerHTML = matching.map(order => {
        const currentIdx = statusSteps.indexOf(order.status || "Received");
        return `
          <div class="bg-white rounded-3xl border border-gray-100 shadow-xl p-6 space-y-6">
            <div class="flex justify-between items-center border-b pb-4">
              <div>
                <span class="px-2.5 py-1 bg-red-100 text-red-700 text-xs font-black rounded-lg uppercase">#${order.id}</span>
                <h3 class="text-xl font-black text-gray-900 mt-2">${order.name} (${order.orderType})</h3>
              </div>
              <span class="text-2xl font-black text-red-600">₹${order.total}</span>
            </div>

            <div class="grid grid-cols-4 gap-2 text-center">
              ${statusSteps.map((step, idx) => `
                <div class="flex flex-col items-center space-y-2">
                  <div class="w-10 h-10 rounded-full flex items-center justify-center font-black text-xs ${idx <= currentIdx ? 'bg-red-600 text-white' : 'bg-gray-100 text-gray-400'}">
                    ${idx + 1}
                  </div>
                  <span class="text-[11px] font-bold ${idx <= currentIdx ? 'text-red-600' : 'text-gray-400'}">${step}</span>
                </div>
              `).join("")}
            </div>

            <div class="bg-gray-50 p-4 rounded-2xl text-xs space-y-1">
              <p><strong>Items:</strong> ${order.itemsSummary || 'Pizza items'}</p>
              <p><strong>Address:</strong> ${order.address}</p>
            </div>
          </div>
        `;
      }).join("");
    }
  </script>
</body>
</html>
