<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <title>Our Customers - Slice Pizza & Cafe</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/custom.css">
</head>
<body class="bg-[#faf7f2] text-gray-800 p-6">
  <div class="max-w-4xl mx-auto bg-white p-8 rounded-3xl shadow-sm space-y-6">
    <h1 class="text-3xl font-black text-gray-900">Customer Testimonials</h1>
    <div id="cust-grid" class="space-y-4"></div>
    <a href="index.html" class="inline-block px-5 py-2.5 bg-red-600 text-white font-bold rounded-xl text-xs">← Back to Menu</a>
  </div>
  <script src="js/shared.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const config = getSiteConfig();
      const grid = document.getElementById("cust-grid");
      if (grid && config.customers) {
        grid.innerHTML = config.customers.map(c => `
          <div class="p-4 bg-gray-50 rounded-2xl border">
            <p class="text-sm italic text-gray-700">"${c.comment}"</p>
            <p class="text-xs font-bold text-gray-900 mt-2">— ${c.name}</p>
          </div>
        `).join("");
      }
    });
  </script>
</body>
</html>
