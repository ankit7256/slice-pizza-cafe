<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Customers - Slice Pizza & Cafe</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/custom.css">
</head>
<body class="bg-[#faf7f2] text-gray-800 antialiased">
  <nav class="bg-white/95 backdrop-blur-md sticky top-0 z-40 border-b border-gray-100 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-3">
        <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-red-600 to-amber-500 flex items-center justify-center text-white text-2xl shadow-lg">
          <i class="fa-solid fa-pizza-slice"></i>
        </div>
        <h1 class="text-xl sm:text-2xl font-black text-gray-900">SLICE <span class="text-red-600 font-serif italic">Pizza & Cafe</span></h1>
      </a>
      <div class="hidden md:flex items-center gap-6 text-sm font-bold text-gray-700">
        <a href="index.html" class="hover:text-red-600">Home</a>
        <a href="index.html#menu-section" class="hover:text-red-600">Menu</a>
        <a href="track.html" class="text-amber-600 font-bold">Track Order</a>
        <a href="customers.html" class="text-red-600 font-extrabold">Our Customers</a>
        <a href="about.html" class="hover:text-red-600">About Us</a>
        <a href="policy.html" class="hover:text-red-600">Policy</a>
      </div>
      <a href="index.html" class="px-4 py-2 bg-red-600 text-white rounded-full font-bold text-xs shadow hover:bg-red-700">Order Now</a>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto px-4 py-12 space-y-10">
    <div class="text-center space-y-2">
      <span class="px-3 py-1 bg-amber-500 text-gray-950 font-bold text-xs rounded-full">Customer Love</span>
      <h2 class="text-3xl sm:text-4xl font-black text-gray-900">Meet Our Happy Diners & Foodies</h2>
    </div>
    <div id="customer-reviews-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  </main>

  <footer class="bg-gray-900 text-white py-8 text-center text-xs text-gray-400">© 2026 Slice Pizza & Cafe. All rights reserved.</footer>
  <script src="js/shared.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const config = getSiteConfig();
      const grid = document.getElementById("customer-reviews-grid");
      if (grid && config.customers) {
        grid.innerHTML = config.customers.map(c => `
          <div class="bg-white p-6 rounded-3xl border border-gray-100 shadow-sm space-y-3">
            <div class="text-amber-400 text-xs">${'★'.repeat(c.rating || 5)}</div>
            <p class="text-xs sm:text-sm text-gray-700 italic">"${c.comment}"</p>
            <div class="flex items-center gap-3 pt-2 border-t border-gray-50">
              <img src="${c.image || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100'}" class="w-10 h-10 rounded-full object-cover border border-amber-400">
              <div>
                <h4 class="font-bold text-xs text-gray-900">${c.name}</h4>
                <p class="text-[10px] text-gray-400">${c.role || 'Happy Customer'}</p>
              </div>
            </div>
          </div>
        `).join("");
      }
    });
  </script>
</body>
</html>
